services:
  doc-formater:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # --- Google prijava --------------------------------------------------
      # Ako su prazne, aplikacija radi bez prijave: svako formatira, ali niko
      # ne može da čuva pravila (set nema kome da pripadne).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Apsolutna adresa aplikacije + /oauth2callback. Mora se poklapati sa
      # onim što je upisano u Google Cloud Console.
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      # openssl rand -hex 32. Ako se promeni, svi su odjavljeni.
      OIDC_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:-}
      # Email-ovi koji smeju da menjaju i brišu tuđa pravila, odvojeni zarezom.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}

      # --- Opciona zajednička lozinka za pristup aplikaciji ----------------
      # Odvojeno pitanje od prijave. Prazno = aplikacija je javno dostupna.
      APP_PASSWORD: ${APP_PASSWORD:-}

      # --- LLM za ekstrakciju pravila (opciono) ----------------------------
      # Bez ovoga ekstrakcija radi na regex heuristici i aplikacija se
      # deployuje sama, bez Mate-a. Radi sa bilo kojim OpenAI-kompatibilnim
      # endpointom; Mate je jedan od njih.
      MATE_BASE_URL: ${MATE_BASE_URL:-}
      MATE_PAT: ${MATE_PAT:-}
      MATE_AGENT_NAME: ${MATE_AGENT_NAME:-doc_rules_extractor}
      MATE_TIMEOUT: ${MATE_TIMEOUT:-600}

      RULES_LIBRARY_DIR: /data/rules_library

    volumes:
      # Biblioteka pravila je jedini trajni podatak; bez volume-a je svaki
      # redeploy briše.
      - rules_library:/data/rules_library

    expose:
      - "8501"
    # Dokploy objavljuje servis kroz svoj Traefik; direktno mapiranje porta
    # otkomentarisati samo za pokretanje bez njega.
    # ports:
    #   - "8501:8501"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8501/_stcore/health", timeout=4
          ).read().strip() == b"ok" else 1)
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  rules_library:

[server]
headless = true
address = "0.0.0.0"
port = 8501
# XSRF zaštita ostaje uključena i radi kroz proxy. `enableCORS = false` se ovde
# namerno ne postavlja: Streamlit ga u kombinaciji sa XSRF zaštitom svejedno
# pregazi na `true` i upozori. Iza Traefika je saobraćaj ionako same-origin.
enableXsrfProtection = true
# Radovi su reda veličine nekoliko MB; podrazumevanih 200 MB je nepotrebno
# velika meta za zloupotrebu.
maxUploadSize = 50

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false

[theme]
# „Classical" iz redizajna: papirna podloga, mastilo umesto crne, zlato kao
# potez a ne ispuna. Postavljeno ovde da Streamlit sam obriše crveno #FF4B4B i
# sivo #F0F2F6 -- CSS u app.py onda ne mora da se bori sa njima.
base = "light"
primaryColor = "#b68235"
backgroundColor = "#f3f2f2"
secondaryBackgroundColor = "#eae9e9"
textColor = "#201f1d"
borderColor = "#cdcaca"
linkColor = "#b68235"
baseRadius = "small"
buttonRadius = "small"
showWidgetBorder = true
showSidebarBorder = false
# Fontove učitava @import u `_inject_custom_css()`; ovde stoje samo imena.
font = "Lora, Georgia, serif"
headingFont = "Cormorant Garamond, Georgia, serif"
baseFontSize = 15

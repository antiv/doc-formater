name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the image ships; 3.12 catches anything that would break
        # a contributor on a newer interpreter.
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # `-t .` is not optional: the test package uses relative imports and
      # without it every module fails to import.
      - name: Run tests
        run: python -m unittest discover -t . -s tests -p 'test_*.py' -v

      # The sample thesis is not in the repository, so the tests that need it
      # skip. Everything else must actually have run -- a suite that silently
      # skipped itself would pass just as loudly.
      - name: Fail if the suite skipped more than the sample-document tests
        run: |
          python - <<'PY'
          import unittest, sys
          result = unittest.TextTestRunner(stream=open('/dev/null', 'w')).run(
              unittest.defaultTestLoader.discover('tests', top_level_dir='.')
          )
          ran = result.testsRun - len(result.skipped)
          print(f"ran={ran} skipped={len(result.skipped)}")
          if ran < 90:
              sys.exit(f"only {ran} tests actually ran; expected the full suite")
          PY

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t styleguard:ci .

      # Building proves the Dockerfile is valid; it does not prove the image
      # contains what the app reads at runtime. `locales/` was missing from the
      # COPY list once, and every string in the container fell back to a bare
      # key while development was perfect. These assertions are that bug.
      - name: Smoke-test the image contents
        run: |
          docker run --rm -i --entrypoint python styleguard:ci - <<'PY'
          from pathlib import Path

          from styleguard.i18n import available_languages, missing_keys, set_language, t

          languages = available_languages()
          assert set(languages) >= {"en", "sr", "fr", "de"}, languages

          for code in languages:
              set_language(code)
              assert t("app.title"), code
              assert not missing_keys(code), (code, missing_keys(code))

          set_language("sr")
          assert t("app.page.library") != "app.page.library", "catalogue not loaded"

          assert Path("/app/assets/icon-192.png").is_file(), "icon missing from image"
          assert Path("/app/presets").is_dir(), "presets missing from image"
          print("image contents OK:", ", ".join(languages))
          PY

      - name: Command line entry point runs
        run: docker run --rm --entrypoint python styleguard:ci cli.py --help
